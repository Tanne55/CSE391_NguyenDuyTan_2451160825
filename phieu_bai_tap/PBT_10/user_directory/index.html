<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Directory</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>👥 User Directory</h1>

        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="🔍 Tìm kiếm theo tên hoặc email...">
        </div>

        <button id="addUserBtn" class="btn-primary">➕ Thêm User</button>

        <div id="loading" class="loading" style="display:none">
            <div class="spinner"></div>
            <p>Đang tải...</p>
        </div>

        <div id="userList" class="user-list"></div>

        <div id="toast" class="toast"></div>
    </div>

    <!-- Modal Form -->
    <div id="modal" class="modal-overlay" style="display:none">
        <div class="modal">
            <h2 id="modalTitle">Thêm User</h2>
            <form id="userForm">
                <input type="hidden" id="userId">
                <div class="form-group">
                    <label>Tên:</label>
                    <input type="text" id="userName" required>
                </div>
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" id="userEmail" required>
                </div>
                <div class="form-group">
                    <label>Username:</label>
                    <input type="text" id="userUsername" required>
                </div>
                <div class="modal-actions">
                    <button type="submit" class="btn-primary">Lưu</button>
                    <button type="button" id="cancelBtn" class="btn-secondary">Hủy</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
