<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTTH03 — jQuery Validation</title>
    <link rel="stylesheet" href="../shared/styles.css">
    <style>
        label.error {
            color: #dc2626;
            font-size: 0.8rem;
            font-weight: normal;
            display: block;
            margin-top: 0.25rem;
        }
        input.error, select.error {
            border-color: #f87171 !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="badge-mode">03 — jQuery Validation Plugin</span>
        <h1>Quản lý sinh viên</h1>
        <p class="subtitle">Plugin <code>jquery.validate</code> — rules + messages, submit qua <code>submitHandler</code>.</p>

        <div id="message" class="message" role="status"></div>

        <div class="stats">
            <div class="stat-card">Tổng sinh viên<strong id="statTotal">0</strong></div>
            <div class="stat-card">Điểm TB lớp<strong id="statAvg">0</strong></div>
        </div>

        <div class="toolbar">
            <button type="button" class="btn btn-primary" id="btnOpenAdd">+ Thêm sinh viên</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Mã SV</th>
                    <th>Họ tên</th>
                    <th>Ngày sinh</th>
                    <th>Lớp</th>
                    <th>Điểm TB</th>
                    <th>Email</th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div class="modal-overlay" id="modalOverlay" aria-hidden="true">
        <div class="modal" role="dialog">
            <div class="modal-header">
                <h2 id="modalTitle">Thêm sinh viên</h2>
                <button type="button" class="btn btn-secondary btn-sm" id="btnCloseModal">✕</button>
            </div>
            <div class="modal-body">
                <form id="studentForm">
                    <div class="form-group">
                        <label for="maSV">Mã sinh viên *</label>
                        <input type="text" id="maSV" name="maSV" placeholder="SV240001">
                    </div>
                    <div class="form-group">
                        <label for="hoTen">Họ và tên *</label>
                        <input type="text" id="hoTen" name="hoTen">
                    </div>
                    <div class="form-group">
                        <label for="ngaySinh">Ngày sinh *</label>
                        <input type="date" id="ngaySinh" name="ngaySinh">
                    </div>
                    <div class="form-group">
                        <label for="lopHoc">Lớp học *</label>
                        <input type="text" id="lopHoc" name="lopHoc">
                    </div>
                    <div class="form-group">
                        <label for="diemTB">Điểm TB (0–4) *</label>
                        <input type="text" id="diemTB" name="diemTB">
                    </div>
                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="text" id="email" name="email">
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Lưu</button>
                        <button type="button" class="btn btn-secondary" id="btnCancel">Hủy</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.20.0/dist/jquery.validate.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.20.0/dist/additional-methods.min.js"></script>
    <script src="../shared/crud-core.js"></script>
    <script src="app.js"></script>
</body>
</html>
